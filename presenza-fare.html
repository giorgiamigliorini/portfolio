<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Presenza e il Fare — Giorgia Migliorini</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,400;1,500;1,600;1,900&family=Inter:wght@400;500;600&display=swap">
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; background:#ffffff; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  img { display:block; width:100%; height:auto; object-fit:cover; }

  :root{
    --pad: clamp(20px, 4.5vw, 64px);
    --paper: #ffffff;
    --ink: #0B0A0A;
    --mut: rgba(11,10,10,0.56);
    --purple: #5B2557;
    --blush: #F6DCE8;
  }

  body{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    font-size:15px;
    line-height:1.6;
  }

  .serif-italic{ font-family:'Fraunces', serif; font-weight:500; font-style:italic; letter-spacing:0; }

  .proj-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: var(--pad);
  }
  .proj-nav a{ font-size:13px; font-weight:500; transition:opacity 0.2s; }
  .proj-nav a:hover{ opacity:0.55; }

  .proj-head{
    padding: 0 var(--pad) 40px;
    max-width:900px;
  }
  .proj-title{
    font-family:'Archivo', sans-serif;
    font-weight:800;
    font-size:clamp(32px, 6vw, 64px);
    letter-spacing:-0.01em;
    margin:0 0 10px;
  }
  .proj-cat{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:16px;
    color:var(--mut);
  }

  .proj-media{
    position:relative;
    width:100vw;
    left:50%;
    margin-left:-50vw;
    height:clamp(320px, 48vw, 620px);
    overflow:hidden;
  }
  .proj-media img{ width:100%; height:100%; object-fit:cover; border-radius:0; }

  .proj-body{
    padding: 48px var(--pad) 140px;
    max-width:640px;
    color:var(--mut);
    font-size:15px;
  }
  .proj-body p{ margin:0 0 16px; }
  .proj-placeholder{
    border:1px dashed rgba(11,10,10,0.22);
    border-radius:4px;
    padding:20px 22px;
  }

  @media (max-width:720px){
    .proj-title{ font-size:clamp(28px,9vw,44px); }
  }
</style>
</head>
<body>
  <div class="proj-nav">
    <a href="index.html">Giorgia Migliorini</a>
    <a href="index.html#lavori">&larr; Back to Projects</a>
  </div>

  <div class="proj-head">
    <h1 class="proj-title">La Presenza e il Fare</h1>
    <div class="proj-cat">Editorial production</div>
  </div>

  <div class="proj-media">
    <img src="presenza-fare.jpg" alt="La Presenza e il Fare">
  </div>

  <div class="proj-body">
    <div class="proj-placeholder">
      <p>Project details coming soon.</p>
    </div>
  </div>
</body>
</html>
